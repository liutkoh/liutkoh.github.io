<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смерека — еко-готель у Карпатах біля озера Синевир</title>
<meta name="description" content="Смерека — 12 дерев'яних будинків у Карпатах біля озера Синевир. Чан під зорями, закарпатська кухня, гори влітку та лижі взимку.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --birch:#f4f1ea; --paper:#fbfaf6; --ink:#1a231e; --muted:#5d695f;
  --forest:#18231d; --forest-2:#22302a; --moss:#6b7f5a; --gold:#d79a6a; --copper:#c27a4a; --copper-dark:#a3613a;
  --line:#e2ddd0; --shadow:0 18px 40px rgba(24,35,29,.12);
  --serif:'Cormorant Garamond',Georgia,serif; --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--birch);color:var(--ink);line-height:1.65;font-size:16px;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08}
a{color:inherit;text-decoration:none}
button{font:inherit}
.container{width:min(1180px,100% - 32px);margin-inline:auto}
section{padding:110px 0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--copper);text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;font-weight:700;margin-bottom:16px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.h2{font-size:clamp(2.2rem,4.6vw,3.6rem);margin-bottom:18px}
.h2 em,h1 em{font-style:italic;color:var(--moss)}
.lead{color:var(--muted);max-width:640px;font-size:1.06rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--copper);color:#fff;padding:15px 30px;border:0;border-radius:999px;font-weight:600;font-size:.95rem;cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.btn:hover{background:var(--copper-dark);transform:translateY(-2px);box-shadow:0 10px 24px rgba(194,122,74,.35)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.line{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.7);backdrop-filter:blur(6px)}
.btn.line:hover{background:#fff;color:var(--forest);box-shadow:none}
.btn .arr{transition:transform .25s}.btn:hover .arr{transform:translateX(4px)}
.bg-img{background:linear-gradient(135deg,#6b7f5a,#18231d) center/cover no-repeat}

/* header */
header{position:fixed;inset:0 0 auto;z-index:60;color:#fff;transition:background .35s,box-shadow .35s}
header.scrolled{background:rgba(24,35,29,.88);backdrop-filter:blur(14px);box-shadow:0 2px 24px rgba(0,0,0,.25)}
.nav{display:flex;align-items:center;justify-content:space-between;height:80px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font:600 1.65rem var(--serif);letter-spacing:.02em;white-space:nowrap}
.logo svg{width:30px;height:30px}
nav ul{display:flex;gap:26px;list-style:none;font-size:.88rem}
nav a{opacity:.85;position:relative;padding:4px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:width .3s}
nav a:hover{opacity:1}nav a:hover::after{width:100%}
.right{display:flex;align-items:center;gap:12px}
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px}
.lang button{background:none;border:0;color:#fff;font-size:.74rem;font-weight:700;letter-spacing:.06em;padding:6px 10px;border-radius:999px;cursor:pointer;opacity:.75;transition:.2s}
.lang button.on{background:#fff;color:var(--forest);opacity:1}
.right .btn{padding:10px 20px;font-size:.84rem}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.8rem;cursor:pointer;line-height:1}

/* hero */
.hero{min-height:100svh;display:flex;align-items:flex-end;color:#fff;padding:150px 0 170px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:-6% 0 0;background:
   linear-gradient(180deg,rgba(15,22,18,.45) 0%,rgba(15,22,18,.2) 40%,rgba(15,22,18,.9) 100%),
   url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=2000&q=72') center/cover,
   linear-gradient(135deg,#3d5a66,#18231d);
  transform:scale(1.08);animation:zoom 18s ease-out forwards;will-change:transform}
@keyframes zoom{to{transform:scale(1)}}
.mist{position:absolute;inset:auto -20% 0;height:45%;background:radial-gradient(ellipse at 30% 100%,rgba(255,255,255,.18),transparent 60%),radial-gradient(ellipse at 75% 100%,rgba(255,255,255,.12),transparent 55%);animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translateX(8%)}}
.hero .container{position:relative}
.hero h1{font-size:clamp(3rem,8vw,6.4rem);max-width:900px;margin-bottom:24px;letter-spacing:-.01em}
.hero h1 em{color:var(--gold)}
.hero p{font-size:1.15rem;max-width:560px;opacity:.92;margin-bottom:36px}
.hero .actions{display:flex;gap:14px;flex-wrap:wrap}
.hero .eyebrow{color:var(--gold)}
.hero-facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:48px;margin-top:64px;font-size:.86rem;opacity:.92}
.hero-facts b{display:block;font:600 2.3rem var(--serif);color:#fff;line-height:1.1}
.scroll-hint{position:absolute;right:32px;bottom:180px;writing-mode:vertical-rl;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.scroll-hint::after{content:"";display:block;width:1px;height:60px;background:#fff;margin:12px auto 0;animation:line 2s infinite}
@keyframes line{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* booking */
.booking{position:relative;margin-top:-80px;z-index:5}
.booking-card{background:rgba(251,250,246,.96);backdrop-filter:blur(12px);box-shadow:var(--shadow);border-radius:24px;padding:26px;border:1px solid rgba(255,255,255,.6)}
.booking form.calc{display:grid;grid-template-columns:1fr 1fr .7fr 1.5fr auto;gap:14px;align-items:end}
label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--copper);box-shadow:0 0 0 4px rgba(194,122,74,.15)}
.result{margin-top:14px;font-size:.95rem;min-height:1.4em}
.result.ok{color:#2f6b45}.result.err{color:#a33a2f}
.quote-box{display:none;margin-top:18px;padding-top:20px;border-top:1px dashed var(--line);grid-template-columns:auto 1fr 1fr auto;gap:14px;align-items:end}
.quote-box.show{display:grid;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.total{font:600 2.2rem var(--serif);color:var(--forest);line-height:1}
.total-note{font-size:.84rem;color:var(--muted);max-width:280px}
.pay-row{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-top:18px;border-top:1px dashed var(--line)}
.pay-row[hidden]{display:none}
.pay-title{font:600 1.35rem var(--serif);color:var(--forest)}
.pay-opt{display:flex;gap:4px;background:var(--birch);padding:4px;border-radius:999px}
.pay-opt label{margin:0;text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);transition:.2s}
.pay-opt label:has(input:checked){background:#fff;color:var(--forest);box-shadow:0 2px 8px rgba(24,35,29,.12)}
.pay-opt label:has(input:focus-visible){outline:2px solid var(--copper)}
.pay-opt input{position:absolute;opacity:0;width:0;height:0}
.btn.pay{background:var(--forest)}.btn.pay:hover{background:#0d1410;box-shadow:0 10px 24px rgba(24,35,29,.3)}
.card-logos{display:flex;gap:6px;flex-wrap:wrap}
.card-logos span{font-size:.68rem;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px;color:var(--muted);letter-spacing:.02em}
.pay-note{font-size:.8rem;color:var(--muted);flex-basis:100%}
.pay-tabs{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap}
.pay-tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;padding:10px 16px;font-weight:600;font-size:.88rem;cursor:pointer;transition:.2s}
.pay-tabs button[aria-selected=true]{border-color:var(--forest);color:var(--forest);box-shadow:inset 0 0 0 1px var(--forest)}
.pay-tabs button[hidden]{display:none}
.pay-panel{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.pay-panel[hidden]{display:none}
.pl-sum{flex-basis:100%;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.pl-sum b{font:600 2rem var(--serif);color:var(--forest)}
.pl-list{flex-basis:100%;display:grid;gap:8px;margin:0}
.pl-list div{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;gap:10px;align-items:center;background:var(--birch);border-radius:12px;padding:10px 14px}
.pl-list dt{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pl-list dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all;min-width:0}
.copy{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--forest)}
.copy.ok{background:var(--forest);color:#fff;border-color:var(--forest)}
@media(max-width:560px){.pl-list div{grid-template-columns:1fr auto}.pl-list dt{grid-column:1/-1}}

/* marquee */
.marquee{background:var(--forest);color:#e9ece6;overflow:hidden;padding:22px 0;margin-top:90px}
.marquee-track{display:flex;gap:48px;width:max-content;animation:mq 40s linear infinite;font:italic 500 1.5rem var(--serif);white-space:nowrap}
.marquee-track span::after{content:"✦";color:var(--gold);margin-left:48px;font-style:normal;font-size:1rem}
@keyframes mq{to{transform:translateX(-50%)}}

/* story */
.story{display:grid;grid-template-columns:1.05fr 1fr;gap:72px;align-items:center}
.story-imgs{position:relative;aspect-ratio:1/1.05}
.story-imgs .a{position:absolute;inset:0 18% 14% 0;border-radius:var(--r)}
.story-imgs .b{position:absolute;inset:48% 0 0 48%;border-radius:var(--r);border:10px solid var(--birch)}
.story-imgs .badge{position:absolute;left:-14px;bottom:4%;background:var(--copper);color:#fff;border-radius:50%;width:120px;height:120px;display:grid;place-items:center;text-align:center;font:600 1rem/1.15 var(--serif);animation:spin 30s linear infinite;box-shadow:var(--shadow)}
@keyframes spin{to{transform:rotate(360deg)}}
.story p+p{margin-top:14px}
.quote{margin-top:30px;padding:22px 24px;background:var(--paper);border-radius:16px;border-left:3px solid var(--copper);font:italic 500 1.35rem/1.4 var(--serif);color:var(--forest)}
.quote small{display:block;font:500 .84rem Manrope;color:var(--muted);margin-top:8px;font-style:normal}

/* houses */
.houses{background:var(--paper)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;margin-top:52px}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-8px);box-shadow:0 28px 50px rgba(24,35,29,.18)}
.card .img{height:280px;position:relative;overflow:hidden}
.card .img i{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s}
.card:hover .img i{transform:scale(1.07)}
.tag{position:absolute;top:18px;left:18px;background:rgba(255,255,255,.94);color:var(--forest);font-size:.74rem;font-weight:700;padding:7px 13px;border-radius:999px;z-index:1}
.card .body{padding:28px;display:flex;flex-direction:column;flex:1}
.card h3{font-size:2rem;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
.chips span{font-size:.78rem;background:var(--birch);padding:5px 12px;border-radius:999px;color:var(--muted)}
.card p{color:var(--muted);font-size:.95rem}
.card .foot{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font:600 1.8rem var(--serif);color:var(--forest)}
.price small{font:500 .8rem Manrope;color:var(--muted)}
.card .btn{padding:11px 22px;font-size:.85rem}

/* seasons */
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:52px}
.season{border-radius:24px;padding:44px;color:#fff;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.season i{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s}
.season:hover i{transform:scale(1.05)}
.season::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,22,18,0) 25%,rgba(15,22,18,.9));z-index:1}
.season>*:not(i){position:relative;z-index:2}
.season h3{font-size:2.6rem;margin-bottom:14px}
.season .eyebrow{color:var(--gold)}
.season ul{list-style:none;display:grid;gap:8px;font-size:.96rem}
.season li::before{content:"— ";color:var(--gold)}

/* experiences */
.exp{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:52px}
.exp div{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px 24px;transition:.3s}
.exp div:hover{background:var(--forest);color:#e9ece6;transform:translateY(-4px)}
.exp div:hover p{color:#b8c2b9}
.exp .ic{width:50px;height:50px;border-radius:14px;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-size:1.35rem;margin-bottom:18px;transition:.3s}
.exp div:hover .ic{background:var(--copper);color:#fff}
.exp h3{font-size:1.45rem;margin-bottom:6px}
.exp p{font-size:.88rem;color:var(--muted);transition:.3s}

/* kitchen */
.kitchen{background:var(--forest);color:#e9ece6;position:relative;overflow:hidden}
.kitchen .lead{color:#b8c2b9}
.kitchen .h2 em{color:var(--gold)}
.kitchen-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.menu{margin-top:32px;display:grid;gap:18px}
.menu-item{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed rgba(255,255,255,.18);padding-bottom:14px}
.menu-item b{font:600 1.3rem var(--serif);color:#fff}
.menu-item span{display:block;font-size:.85rem;color:#a9b4aa}
.menu-item i{font-style:normal;color:var(--gold);white-space:nowrap;font-weight:600}
.kitchen-img{border-radius:24px;aspect-ratio:4/5;position:relative}
.kitchen-img::after{content:"";position:absolute;inset:18px;border:1px solid rgba(255,255,255,.35);border-radius:16px}

/* offers */
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:52px}
.offer{background:var(--paper);border-radius:24px;padding:34px;border:1px solid var(--line);display:flex;flex-direction:column;transition:.3s}
.offer:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.offer.hot{background:linear-gradient(160deg,#c9834f,#9e5a33);color:#fff;border-color:transparent;transform:scale(1.03)}
.offer.hot:hover{transform:scale(1.03) translateY(-6px)}
.offer.hot p,.offer.hot li{color:#fde9dc}
.offer h3{font-size:2rem;margin:8px 0 10px}
.offer .badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;opacity:.8}
.offer p{color:var(--muted);font-size:.92rem}
.offer ul{margin:18px 0 24px;padding-left:18px;font-size:.92rem;color:var(--muted);display:grid;gap:5px}
.offer .price{margin-top:auto}
.offer.hot .price,.offer.hot .price small{color:#fff}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:220px;gap:14px;margin-top:48px}
.gallery button{border:0;border-radius:18px;cursor:zoom-in;overflow:hidden;position:relative;padding:0}
.gallery button i{position:absolute;inset:0;background:linear-gradient(135deg,#6b7f5a,#18231d) center/cover;background-size:cover;background-position:center;transition:transform .7s}
.gallery button:hover i{transform:scale(1.08)}
.gallery .w{grid-column:span 2}.gallery .t{grid-row:span 2}
.lightbox{position:fixed;inset:0;background:rgba(10,15,12,.92);display:none;place-items:center;z-index:100;padding:20px;cursor:zoom-out}
.lightbox.show{display:grid;animation:fade .3s}
.lightbox img{max-width:min(1200px,100%);max-height:88vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}

/* reviews */
.reviews{background:var(--paper)}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.rev{background:#fff;padding:32px;border-radius:24px;box-shadow:var(--shadow);position:relative}
.rev::before{content:"“";position:absolute;right:24px;top:6px;font:600 5rem var(--serif);color:var(--birch);line-height:1}
.stars{color:var(--copper);letter-spacing:3px;margin-bottom:12px}
.rev p{font-size:.95rem;margin-bottom:18px;position:relative}
.rev b{font-size:.9rem}.rev small{display:block;color:var(--muted);font-size:.8rem}

/* road + faq */
.two{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.route{list-style:none;display:grid;gap:20px;margin-top:30px}
.route li{display:grid;grid-template-columns:46px 1fr;gap:16px}
.route .n{width:46px;height:46px;border-radius:50%;background:var(--forest);color:var(--gold);display:grid;place-items:center;font-weight:700}
.route b{display:block}.route span{color:var(--muted);font-size:.92rem}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--copper);font-size:1.5rem;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);margin-top:10px;font-size:.95rem}

/* contacts */
.contacts{background:var(--forest);color:#e9ece6}
.contacts .lead{color:#b8c2b9}
.contacts .h2 em{color:var(--gold)}
.contacts .two{margin-top:44px}
.c-list{list-style:none;display:grid;gap:22px}
.c-list b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin-bottom:2px}
.c-list a:hover{color:var(--gold)}
form.contact{display:grid;gap:14px;background:var(--forest-2);padding:30px;border-radius:24px;border:1px solid rgba(255,255,255,.08)}
.contacts label{color:#b8c2b9}
.contacts input,.contacts textarea{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#fff}
.contacts .result.ok{color:#9fd8b0}.contacts .result.err{color:#f0a598}
.hp{position:absolute;left:-9999px}
footer{background:#111914;color:#7f8b82;padding:32px 0;font-size:.85rem}
footer .container{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* toast + top */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,40px);background:var(--forest);color:#fff;padding:14px 22px;border-radius:14px;box-shadow:var(--shadow);opacity:0;transition:.35s;z-index:90;max-width:calc(100% - 32px);font-size:.92rem}
.toast.show{opacity:1;transform:translate(-50%,0)}
.to-top{position:fixed;right:20px;bottom:20px;width:48px;height:48px;border-radius:50%;border:0;background:var(--copper);color:#fff;font-size:1.2rem;cursor:pointer;opacity:0;pointer-events:none;transition:.3s;z-index:80;box-shadow:var(--shadow)}
.to-top.show{opacity:1;pointer-events:auto}

/* reveal */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}html{scroll-behavior:auto}}

@media(max-width:1100px){
  nav ul{gap:16px;font-size:.82rem}
  .right .btn{display:none}
}
@media(max-width:1020px){
  .booking form.calc{grid-template-columns:1fr 1fr}
  .booking form.calc .wide{grid-column:span 2}
  .quote-box{grid-template-columns:1fr 1fr}
  .quote-box .sum{grid-column:span 2}
  .exp{grid-template-columns:1fr 1fr}
  .offers,.rev-grid{grid-template-columns:1fr}
  .offer.hot,.offer.hot:hover{transform:none}
  .story,.kitchen-grid,.two{grid-template-columns:1fr;gap:44px}
  .gallery{grid-template-columns:1fr 1fr}
  .scroll-hint{display:none}
}
@media(max-width:860px){
  section{padding:72px 0}
  .burger{display:block}

function plural(n, f) {

/* ===== Анімації ===== */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold: .1});
function observeReveal() { $$('.reveal:not(.in)').forEach(el => io.observe(el)); }
const fmtCount = (b, v) => v.toLocaleString(LOCALE[lang], {minimumFractionDigits: +(b.dataset.dec || 0), maximumFractionDigits: +(b.dataset.dec || 0)}) + (b.dataset.suffix || '');
function runCounters() {
  $$('[data-count]').forEach(b => {
    const end = +b.dataset.count, t0 = performance.now(), dur = 1600;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      b.textContent = fmtCount(b, end * e); if (p < 1) requestAnimationFrame(step); else b.dataset.done = 1; };
    requestAnimationFrame(step);

}
const header = $('#header'), menu = $('#menu'), burger = $('#burger'), toTop = $('#toTop'), heroBg = $('#heroBg');

/* ===== Бронювання ===== */
const seasonK = d => { const m = d.getMonth(); return (m >= 5 && m <= 7) || m === 11 || m <= 1 ? 1.2 : 1; };
const weekendK = d => [5, 6].includes(d.getDay()) ? 1.15 : 1;
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const inEl = $('#in'), outEl = $('#out'), today = new Date();
inEl.min = iso(today); inEl.value = iso(addDays(today, 7));
outEl.min = iso(addDays(today, 8)); outEl.value = iso(addDays(today, 9));
inEl.addEventListener('change', () => {
  if (!inEl.value) return;
  const next = addDays(parse(inEl.value), 1);
  outEl.min = iso(next);
  if (!outEl.value || outEl.value <= inEl.value) outEl.value = iso(next);
});
$('#cards').addEventListener('click', e => {
  const b = e.target.closest('[data-house]'); if (!b) return;
  $('#house').value = b.dataset.house;
  $('#book').scrollIntoView({behavior: 'smooth', block: 'center'});
});

let lastQuote = null;
function calc() {
  if (!inEl.value || !outEl.value) return {err: t('err.dates')};
  const a = parse(inEl.value), b = parse(outEl.value);
  if (a < parse(iso(today))) return {err: t('err.past')};
  const nights = Math.round((b - a) / 864e5);
  if (nights < 1) return {err: t('err.order')};
  if (nights > 30) return {err: t('err.long')};
  const h = HOUSES.find(x => x.id === $('#house').value), g = +$('#guests').value;
  if (g > h.max) return {err: t('err.cap').replace('{h}', t('h.' + h.id)).replace('{n}', h.max)};
  let total = 0;
  for (let i = 0; i < nights; i++) { const d = addDays(a, i); total += h.price * seasonK(d) * weekendK(d); }
  const disc = nights >= 7;
  if (disc) total *= .9;
  return {h, g, nights, total, disc, a, b};
}
function showQuote() {
  const q = calc(), r = $('#bookResult'), box = $('#quoteBox');

  box.classList.add('show');
  updatePayBtn();
}

  const b = e.target.closest('.copy'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); }
  catch (err) { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  b.textContent = t('copied'); b.classList.add('ok');
  setTimeout(() => { b.textContent = t('copy'); b.classList.remove('ok'); }, 1800);
});
$('#plDone').addEventListener('click', async e => {
  const out = $('#bookResult');
  const q = calc(); if (q.err) return showQuote();
  const name = $('#bname').value.trim(), contact = $('#bcontact').value.trim();
  if (!name || !contact) { out.className = 'result err'; out.textContent = t('pay.need'); $(name ? '#bcontact' : '#bname').focus(); return; }
  await sendMail({
    _subject: '💳🇵🇱 ' + T.uk.subjBook, 'Ім\'я / Name': name, 'Контакт / Contact': contact, 'Будинок / Cabin': T.uk['h.' + q.h.id],
    'Заїзд / Check-in': inEl.value, 'Виїзд / Check-out': outEl.value, 'Ночей / Nights': q.nights, 'Гостей / Guests': q.g,
    'Сума / Total': Math.round(q.total).toLocaleString('uk-UA') + ' ₴',
    'Оплата / Payment': `${plnAmount(q)} zł ≈ ${payAmount(q).toLocaleString('uk-UA')} ₴ (${payShare() === 1 ? 'повна сума' : 'передоплата 30%'}) — гість каже, що оплатив з Польщі (BLIK/przelew). Перевірте надходження. Призначення: ${plTitle()}`,
    'Мова / Lang': lang
  }, e.currentTarget, out, t('pl.thanks'));
});
$$('input[name=payShare]').forEach(r => r.addEventListener('change', updatePayBtn));
function payUrl(amount, comment) {
  if (!/send\.monobank\.ua\/jar\//.test(PAY_LINK)) return PAY_LINK;
  const u = new URL(PAY_LINK);
  u.searchParams.set('a', amount);
  u.searchParams.set('t', comment);
  return u.toString();
}
$('#payBtn').addEventListener('click', () => {
  const out = $('#bookResult');
  const q = calc(); if (q.err) return showQuote();
  const name = $('#bname').value.trim(), contact = $('#bcontact').value.trim();
  if (!name || !contact) { out.className = 'result err'; out.textContent = t('pay.need'); $(name ? '#bcontact' : '#bname').focus(); return; }
  const amount = payAmount(q);
  const url = payUrl(amount, `${t('pay.comment')}: ${name}, ${inEl.value} — ${outEl.value}`);
  // з noopener window.open завжди повертає null, тому посилання показуємо завжди — на випадок блокування вкладки
  window.open(url, '_blank', 'noopener');
  out.className = 'result ok';
  const prefilled = /send\.monobank\.ua\/jar\//.test(PAY_LINK);
  out.textContent = t('pay.opened') + ' ' + (prefilled ? '' : t('pay.enter').replace('{s}', money(amount)) + ' ') + t('pay.blocked');
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = url; a.style.textDecoration = 'underline'; a.style.wordBreak = 'break-all';
  out.append(a);
  // Повідомляємо власника, що гість перейшов до оплати
  fetch(FORM_ENDPOINT, {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify({
    _subject: '💳 ' + T.uk.subjBook, _template: 'table', _captcha: 'false',
    'Ім\'я / Name': name, 'Контакт / Contact': contact, 'Будинок / Cabin': T.uk['h.' + q.h.id],
    'Заїзд / Check-in': inEl.value, 'Виїзд / Check-out': outEl.value, 'Ночей / Nights': q.nights, 'Гостей / Guests': q.g,
    'Сума / Total': Math.round(q.total).toLocaleString('uk-UA') + ' ₴',
    'Оплата / Payment': `${amount.toLocaleString('uk-UA')} ₴ (${payShare() === 1 ? 'повна сума' : 'передоплата 30%'}) — гість перейшов на сторінку оплати, перевірте надходження`,
    'Мова / Lang': lang
  })}).catch(() => {});
});
$('#bookingForm').addEventListener('submit', e => { e.preventDefault(); showQuote(); });
$('#bookingForm').addEventListener('change', () => { if (lastQuote) showQuote(); });

/* ===== Надсилання на пошту (FormSubmit) ===== */
async function sendMail(data, btn, out, okMsg) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = t('sending');
  try {
    const res = await fetch(FORM_ENDPOINT, {method: 'POST', headers: {'Content-Type': 'application/json', 'Accept': 'application/json'}, body: JSON.stringify({...data, _template: 'table', _captcha: 'false'})});
    const j = await res.json().catch(() => ({}));
    if (!res.ok || String(j.success) === 'false') throw new Error(j.message || res.status);
    out.className = 'result ok'; out.textContent = okMsg; toast(okMsg);
    return true;
  } catch (err) {
    out.className = 'result err'; out.textContent = t('fail');
    const a = document.createElement('a'); a.href = 'mailto:' + EMAIL_TO; a.textContent = EMAIL_TO; a.style.textDecoration = 'underline';
    out.append(a);
    return false;
  } finally { btn.disabled = false; btn.innerHTML = old; }
}
$('#contactForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, out = $('#contactMsg');
  if (f._honey.value) return;
  const name = $('#cname').value.trim(), contact = $('#ccontact').value.trim(), msg = $('#ctext').value.trim();
  if (!name || !contact || !msg) { out.className = 'result err'; out.textContent = t('fill'); return; }
  const ok = await sendMail({_subject: t('subjMsg'), 'Ім\'я / Name': name, 'Контакт / Contact': contact, 'Повідомлення / Message': msg, 'Мова / Lang': lang}, f.querySelector('button[type=submit]'), out, t('sent'));
  if (ok) f.reset();
});
$('#quoteBox').addEventListener('submit', async e => {
  e.preventDefault();
  const out = $('#bookResult');
  if (e.target._honey.value) return;
  const q = calc(); if (q.err) return showQuote();

    _subject: t('subjBook'), 'Ім\'я / Name': name, 'Контакт / Contact': contact,
    'Будинок / Cabin': T.uk['h.' + q.h.id], 'Заїзд / Check-in': inEl.value, 'Виїзд / Check-out': outEl.value,
    'Ночей / Nights': q.nights, 'Гостей / Guests': q.g, 'Сума / Total': Math.round(q.total).toLocaleString('uk-UA') + ' ₴', 'Мова / Lang': lang
  }, e.target.querySelector('button[type=submit]'), out, t('bookSent'));
  if (ok) e.target.reset();
});

renderAll();
setTimeout(runCounters, 400);
</script>
